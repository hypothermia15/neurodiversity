# Siteyi statik HTML olarak derleyip GitHub Pages'te yayınlar.
# Adres: https://<kullanıcı>.github.io/<repo-adı>/
name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Yarn'ı etkinleştir
        run: corepack enable

      - name: Bağımlılıkları kur
        run: yarn install --immutable

      # Statik dışa aktarımda çalışmayan sunucu tarafı dosyalar (yönlendirme
      # proxy'si, dinamik OG görselleri, robots yanıtı) yalnızca bu derlemede çıkarılır.
      - name: Sunucuya özel dosyaları çıkar
        run: rm -rf proxy.ts app/api app/sitemap.xml

      - name: Derle
        run: yarn build

      - name: .nojekyll ekle
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
